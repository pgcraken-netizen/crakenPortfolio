<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 84">
  <!-- 地図に描き足す「まちの掲示板」。イラストの線の太さ・色に合わせた手描き風 -->
  <g stroke="#3b3029" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="46" cy="80" rx="34" ry="3.5" fill="#6f8f4a" fill-opacity=".35" stroke="none"/>
    <!-- 脚 -->
    <rect x="17" y="40" width="6" height="40" rx="1.5" fill="#b27a45"/>
    <rect x="69" y="40" width="6" height="40" rx="1.5" fill="#b27a45"/>
    <!-- 屋根（ロゴの緑） -->
    <path d="M6 20 L46 5 L86 20 L82 24 L10 24 Z" fill="#3e9a4f"/>
    <path d="M14 21 L46 9 L78 21" fill="none" stroke="#8fd19a" stroke-width="1.4"/>
    <!-- 板 -->
    <rect x="11" y="23" width="70" height="44" rx="2.5" fill="#c98f55"/>
    <rect x="15" y="27" width="62" height="36" rx="1.5" fill="#e9c58f"/>
    <!-- 貼り紙：まちの地図 -->
    <g transform="rotate(-4 32 44)">
      <rect x="19" y="30" width="27" height="29" fill="#fffdf4"/>
      <path d="M22 54 C27 46 31 50 34 42 S41 36 43 34" fill="none" stroke="#3b8fd6" stroke-width="1.6"/>
      <path d="M22 39 H43 M30 32 V57" fill="none" stroke="#d9b47a" stroke-width="1.3"/>
      <circle cx="35" cy="45" r="2.6" fill="#e2496a" stroke-width="1.2"/>
    </g>
    <!-- 貼り紙：お知らせ -->
    <g transform="rotate(5 61 41)">
      <rect x="50" y="29" width="22" height="16" fill="#cfeaff"/>
      <path d="M53 34 H69 M53 38 H66 M53 42 H68" fill="none" stroke="#5a7c96" stroke-width="1.1"/>
    </g>
    <g transform="rotate(-3 60 55)">
      <rect x="51" y="48" width="19" height="12" fill="#fff1a6"/>
      <path d="M54 52 H67 M54 56 H63" fill="none" stroke="#a08a3a" stroke-width="1.1"/>
    </g>
    <!-- 画びょう -->
    <circle cx="32" cy="31" r="1.9" fill="#ef7a1a" stroke-width="1"/>
    <circle cx="61" cy="30" r="1.7" fill="#7a4cc0" stroke-width="1"/>
    <circle cx="60" cy="49" r="1.6" fill="#2f8f46" stroke-width="1"/>
  </g>
</svg>
